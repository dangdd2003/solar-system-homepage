name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

concurrency:
  group: test-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.x
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
