services:
  website:
    image: homepage:production
    build:
      context: ../..
      dockerfile: .github/deployment/Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
